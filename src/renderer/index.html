<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: file:; media-src 'self' file:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShotSheetEditor</title>

  <!-- Design Tokens & Base Styles -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div id="app">
    <!-- TOOLBAR (40px) -->
    <div class="toolbar">
      <div class="toolbar-group toolbar-group-start">
        <button class="tb-btn" id="btnOpenVideo" title="Open Video (Ctrl+O)">
          <span>Open Video</span>
        </button>
      </div>

      <div class="toolbar-separator"></div>

      <div class="toolbar-group">
        <button class="tb-btn" id="btnDetectScenes" title="Detect Scenes (Ctrl+Shift+D)">
          <span>Detect Scenes</span>
        </button>
        <div class="threshold-control">
          <label for="thresholdSlider" class="threshold-label">Threshold</label>
          <input
            type="range"
            id="thresholdSlider"
            class="slim-slider"
            min="0.05"
            max="0.9"
            step="0.05"
            value="0.3"
            title="Scene detection sensitivity (0.05-0.9)"
          />
          <span class="threshold-value" id="thresholdValue">0.30</span>
        </div>
      </div>

      <div class="toolbar-separator"></div>

      <div class="toolbar-group">
        <button class="tb-btn" id="btnUndo" title="Undo (Ctrl+Z)">Undo</button>
        <button class="tb-btn" id="btnRedo" title="Redo (Ctrl+Shift+Z)">Redo</button>
      </div>

      <div class="toolbar-separator"></div>

      <div class="toolbar-group">
        <span class="toolbar-label">Grid:</span>
        <div class="pill-group" id="gridSizeGroup">
          <button class="pill-btn" data-size="small">S</button>
          <button class="pill-btn" data-size="medium">M</button>
          <button class="pill-btn active" data-size="large">L</button>
          <button class="pill-btn" data-size="xlarge">XL</button>
        </div>
      </div>

      <div class="toolbar-separator"></div>

      <div class="toolbar-group">
        <span class="toolbar-label">Filter:</span>
        <div class="pill-group" id="filterGroup">
          <button class="pill-btn active" data-filter="all">All</button>
          <button class="pill-btn" data-filter="favs">Favs</button>
        </div>
      </div>

      <div style="flex: 1;"></div>

      <div class="toolbar-group toolbar-group-end">
        <button class="tb-btn" id="btnExport" title="Export (Ctrl+E)">
          <span>Export</span>
          <span style="margin-left: 4px; opacity: 0.6;">▼</span>
        </button>
        <button class="tb-btn" id="btnTheme" title="Toggle Theme">
          <span id="themeIcon">●</span>
        </button>
      </div>
    </div>

    <!-- MAIN AREA (flex row) -->
    <div class="main-area">
      <!-- SHOT GRID CONTAINER -->
      <div class="shot-grid-container">
        <div class="shot-grid" id="shotGrid"></div>
        <div class="empty-state" id="emptyState">
          <div class="empty-state-content">
            <div class="empty-state-icon">▶</div>
            <div class="empty-state-title">No Video Loaded</div>
            <div class="empty-state-hint">Drop a video or click Open Video to begin</div>
          </div>
        </div>
      </div>

      <!-- VERTICAL RESIZE DIVIDER -->
      <div class="resize-divider resize-divider-vertical"></div>

      <!-- RIGHT SIDEBAR (280px) -->
      <div class="sidebar">
        <!-- VIDEO PREVIEW PANEL -->
        <div class="panel video-panel">
          <div class="panel-header">
            <span class="panel-title">VIDEO PREVIEW</span>
          </div>
          <div class="panel-body">
            <video
              id="videoPlayer"
              class="video-player"
              crossorigin="anonymous"
              preload="metadata"
            ></video>
            <div class="tc-display" id="tcDisplay">00:00:00.00</div>
            <div class="video-controls">
              <button class="video-btn" id="btnPrevFrame" title="Previous Frame (←)">◀</button>
              <button class="video-btn" id="btnPlayPause" title="Play/Pause (Space)">▶</button>
              <button class="video-btn" id="btnNextFrame" title="Next Frame (→)">▶▶</button>
            </div>
          </div>
        </div>

        <!-- HORIZONTAL RESIZE DIVIDER -->
        <div class="resize-divider resize-divider-horizontal"></div>

        <!-- SCENE INFO PANEL -->
        <div class="panel info-panel">
          <div class="panel-header">
            <span class="panel-title">SCENE INFO</span>
          </div>
          <div class="panel-body" id="infoPanelBody">
            <div class="info-placeholder">Select a shot to view details</div>
          </div>
        </div>
      </div>
    </div>

    <!-- STATUSBAR (22px) -->
    <div class="statusbar">
      <div class="status-left">
        <div class="status-item">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-text" id="statusText">Ready</span>
        </div>
      </div>
      <div class="status-center">
        <div class="status-item">
          <span id="shotCount">0</span>
          <span class="status-label">shots</span>
        </div>
        <div class="status-divider"></div>
        <div class="status-item">
          <span id="favCount">0</span>
          <span class="status-label">favs</span>
        </div>
        <div class="status-divider"></div>
        <div class="status-item">
          <span class="status-label">Threshold:</span>
          <span id="statusThreshold">0.30</span>
        </div>
      </div>
      <div class="status-right">
        <div class="status-item">
          <span class="status-label">Duration:</span>
          <span id="videoDuration">00:00:00</span>
        </div>
      </div>
    </div>
  </div>

  <!-- SELECTION BAR (appears when shots selected) -->
  <div class="selection-bar" id="selectionBar" style="display: none;">
    <div class="selection-bar-content">
      <span id="selectionCount">0 selected</span>
      <button class="sb-btn" id="btnMarkFav">★ Mark Favorite</button>
      <button class="sb-btn" id="btnUnmarkFav">☆ Unmark</button>
      <button class="sb-btn" id="btnDelete">Delete</button>
      <button class="sb-btn sb-btn-dismiss" id="btnClearSelection">✕</button>
    </div>
  </div>

  <!-- MODALS & OVERLAYS -->
  <div id="modalsContainer"></div>
  <div id="toastsContainer" class="toasts-container"></div>
  <div id="contextMenuContainer"></div>

  <!-- PROGRESS OVERLAY (for detection/export) -->
  <div class="progress-overlay" id="progressOverlay" style="display: none;">
    <div class="progress-content">
      <div class="progress-title" id="progressTitle">Processing...</div>
      <div class="progress-bar">
        <div class="progress-bar-fill" id="progressBarFill" style="width: 0%;"></div>
      </div>
      <div class="progress-text" id="progressText">0%</div>
      <button class="btn-ghost" id="btnCancelProgress">Cancel</button>
    </div>
  </div>

  <!-- SCRIPTS (load in order) -->
  <script src="js/ipc.js"></script>
  <script src="js/state.js"></script>
  <script src="js/undoRedo.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/shotGrid.js"></script>
  <script src="js/videoPlayer.js"></script>
  <script src="js/selectionManager.js"></script>
  <script src="js/toolbar.js"></script>
  <script src="js/shortcuts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
